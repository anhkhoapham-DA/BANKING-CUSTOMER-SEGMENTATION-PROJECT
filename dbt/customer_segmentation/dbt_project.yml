name: 'customer_segmentation'
version: '1.0.0'

profile: 'customer_segmentation'

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

clean-targets:
  - "target"
  - "dbt_packages"

models:
  customer_segmentation:
    +materialized: view
    bronze:
      +docs:
        node_color: "#b87333"
    silver:
      +docs:
        node_color: "#6b7a8f"
    gold:
      +docs:
        node_color: "#c9a227"

seeds:
  customer_segmentation:
    product_mapping:
      +column_types:
        product_id: varchar(50)
        product_name: nvarchar(255)
        product_short_name: nvarchar(255)
        product_group: nvarchar(255)